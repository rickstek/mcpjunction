# Supply-chain hardening: every action is pinned to a full commit SHA (the
# trailing comment records the tag it resolved from). Tags are mutable; SHAs
# are not. This workflow holds a Cloudflare API token, so a compromised action
# tag is the main way that token could leak. To bump a pin, resolve the new
# tag with:  curl -s https://api.github.com/repos/<owner>/<repo>/commits/<tag>
# and update both the SHA and the comment.
name: Nightly refresh and deploy

on:
  schedule:
    # 06:17 UTC daily. Off-the-hour on purpose: GitHub's scheduler is heavily
    # oversubscribed at :00 and jobs get delayed or dropped.
    - cron: "17 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_data_refresh:
        description: "Deploy current files without hitting the GitHub API"
        type: boolean
        default: false

# Never let two runs deploy at once.
concurrency:
  group: nightly-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7 requires >=22.12; 24 matches the env the lockfile was
          # generated with.
          node-version: "24"
          cache: npm

      - name: Refresh dataset from GitHub API
        if: inputs.skip_data_refresh != true
        env:
          # The built-in token authenticates our API calls: 30 search req/min
          # instead of 10, and 5,000 core req/hr. No PAT needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_PER_QUERY: "6"
          REQUEST_SLEEP: "2.5"
        run: python3 scripts/pipeline.py

      - name: Sanity check dataset before build
        # Runs BEFORE the build so a gutted dataset never produces a gutted
        # site. If the API had a bad day and returned < 200 servers, we
        # refuse to deploy — the previous good version stays live.
        run: |
          set -euo pipefail
          test -s public/data/mcp_servers.json || { echo "MISSING: public/data/mcp_servers.json"; exit 1; }
          test -s public/data/mcp_servers.csv  || { echo "MISSING: public/data/mcp_servers.csv"; exit 1; }
          test -s categories.json              || { echo "MISSING: categories.json"; exit 1; }
          for f in public/robots.txt public/license.xml public/llms.txt; do
            test -s "$f" || { echo "MISSING OR EMPTY: $f"; exit 1; }
          done
          python3 - <<'PY'
          import json, sys, pathlib
          d = json.loads(pathlib.Path("public/data/mcp_servers.json").read_text())
          n = d.get("count", 0)
          print(f"dataset OK: {n} active servers, generated {d.get('generated_at')}")
          if n < 200:
              sys.exit(f"REFUSING TO DEPLOY: only {n} servers (expected 200+)")
          PY

      - name: Install site dependencies
        run: npm ci

      - name: Astro build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Build sitemap
        # Walks dist/ (the just-built site) so the sitemap only lists URLs
        # that actually exist. Runs AFTER astro build; dist/ is not committed.
        run: python3 scripts/build_sitemap.py

      - name: Post-build verification
        # Every URL the licensing surface depends on must exist in dist/
        # before we ship. This catches regressions like accidentally deleting
        # a passthrough file, breaking the sitemap builder, or an Astro
        # route silently dropping.
        run: |
          set -euo pipefail
          for f in dist/index.html dist/licensing.html dist/404.html \
                   dist/data.html dist/categories.html \
                   dist/robots.txt dist/license.xml dist/llms.txt \
                   dist/sitemap.xml \
                   dist/data/mcp_servers.json dist/data/mcp_servers.csv; do
            test -s "$f" || { echo "MISSING OR EMPTY in dist/: $f"; exit 1; }
          done
          # Sanity: at least one server page and one category page emitted.
          test "$(find dist/servers -name '*.html' | wc -l)" -gt 100 \
            || { echo "Too few server pages emitted"; exit 1; }
          test "$(find dist/categories -name '*.html' | wc -l)" -gt 5 \
            || { echo "Too few category pages emitted"; exit 1; }
          # Passthrough files must be byte-identical to their public/ source.
          for f in robots.txt license.xml llms.txt data/mcp_servers.json data/mcp_servers.csv; do
            diff -q "public/$f" "dist/$f" > /dev/null || { echo "PASSTHROUGH MISMATCH: $f"; exit 1; }
          done
          # llms.txt enumerates every category URL by hand (it is a static
          # passthrough file, not generated). The existing llms.txt gate
          # catches a RENAMED slug — the old URL 404s — but an ADDED category
          # would silently go unlisted, so check coverage against the taxonomy.
          python3 - <<'PY'
          import json, pathlib, sys
          cats = json.loads(pathlib.Path("categories.json").read_text(encoding="utf-8"))
          llms = pathlib.Path("dist/llms.txt").read_text(encoding="utf-8")
          missing = [c["slug"] for c in cats["categories"]
                     if f"https://mcpjunction.ai/categories/{c['slug']}" not in llms]
          if missing:
              sys.exit("llms.txt does not list these categories: " + ", ".join(missing))
          print(f"llms.txt lists all {len(cats['categories'])} categories")
          PY
          echo "post-build OK"

      - name: Commit refreshed data
        # Note on recursion: this push does NOT re-trigger the workflow's
        # `push:` event. Commits made with the built-in GITHUB_TOKEN never
        # start new workflow runs — that's GitHub's own loop guard.
        #
        # Only public/data and state/lastmod.json are committed. dist/ and
        # dist/sitemap.xml are build artifacts, regenerated on each run.
        # state/lastmod.json is not an artifact: it carries the per-URL
        # content signatures that sitemap lastmod dates are computed against,
        # so losing it resets every date to the next build.
        run: |
          set -euo pipefail
          git config user.name "mcpjunction-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data state/lastmod.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: nightly refresh $(date -u +%Y-%m-%d)"
            # Rebase first: if a human pushed to main while this ran, a bare
            # push is rejected and the whole run dies after the API work is
            # already done. Rebasing our one data commit on top is always safe.
            git pull --rebase origin main
            git push
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify licensing surface + declared URL sample
        # This step enforces the zero-redirect contract:
        #  1. Every URL in the core licensing surface returns 200 with zero
        #     redirects on the first hop.
        #  2. A sample of declared URLs (from the sitemap and JSON-LD `url`
        #     fields) also returns 200 zero-redirect.
        # Under Pay Per Crawl metering, agent fetchers often don't follow
        # redirects — a 307 costs a fetch. The served and declared surfaces
        # must be identical.
        run: |
          set -euo pipefail
          sleep 15
          BASE="https://mcpjunction.ai"

          check_zero_redirect() {
            local url="$1"
            # -w prints the first-hop status code (no -L, so we don't follow).
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" != "200" ]; then
              echo "::error::REDIRECT/FAIL  $url -> HTTP $code"
              return 1
            fi
            echo "200  $url"
            return 0
          }

          fail=0
          # Core licensing surface — MUST be byte-perfect and zero-redirect.
          for p in / /robots.txt /license.xml /llms.txt /licensing \
                   /sitemap.xml /data /data/mcp_servers.json /data/mcp_servers.csv \
                   /categories; do
            check_zero_redirect "$BASE$p" || fail=1
          done

          # Fetch the sitemap ONCE to a file. Everything below greps the file,
          # never a live pipe. Two hard-won rules for this block:
          #  - no `| while read` (subshell: fail=1 would silently not
          #    propagate and the checks would be decorative)
          #  - no `big-output | head -1` under pipefail (head closes the pipe
          #    after one line, the upstream grep/curl takes SIGPIPE and exits
          #    141, and set -e kills the whole step — this exact bug failed
          #    runs #4 and #5 after a successful deploy). grep -m1 on a FILE
          #    stops itself with no pipe to break.
          sitemap_file=$(mktemp)
          curl -sS "$BASE/sitemap.xml" -o "$sitemap_file"

          # Sample 25 URLs from the sitemap and check them.
          echo "--- sitemap sample ---"
          mapfile -t sample_urls < <(grep -oE 'https://mcpjunction\.ai[^<]+' "$sitemap_file" | shuf -n 25)
          test "${#sample_urls[@]}" -gt 0 || { echo "::error::sitemap sample came back empty"; fail=1; }
          for u in "${sample_urls[@]}"; do
            check_zero_redirect "$u" || fail=1
          done

          # Pull one server page and check its declared JSON-LD url is also
          # 200. The JSON-LD is emitted minified, so the url field is
          # greppable without a JSON parser.
          #
          # The pattern is anchored to /servers/ on purpose. The markup now
          # carries a publisher Organization whose url is the site root, so a
          # bare '"url":"https://mcpjunction.ai[^"]*"' matches twice on one
          # line, -m1 (which stops at the first matching LINE, not match)
          # returns both, and the check ends up curling a two-line string.
          echo "--- JSON-LD url check ---"
          server_page=$(grep -m1 -oE 'https://mcpjunction\.ai/servers/[^<]+' "$sitemap_file" || true)
          if [ -n "$server_page" ]; then
            page_file=$(mktemp)
            curl -sS "$server_page" -o "$page_file"
            declared=$(grep -o '"url":"https://mcpjunction.ai/servers/[^"]*"' "$page_file" | sed -n '1p' | cut -d'"' -f4 || true)
            if [ -n "$declared" ]; then
              check_zero_redirect "$declared" || fail=1
            else
              echo "::error::no JSON-LD url found on $server_page"
              fail=1
            fi
          else
            echo "::error::no server pages found in sitemap"
            fail=1
          fi

          if [ "$fail" = "1" ]; then
            echo "::error::One or more declared URLs failed the zero-redirect check."
            exit 1
          fi
          echo "All declared URLs served 200 zero-redirect."

      - name: Verify MCP endpoint
        # /mcp is a declared entry point (llms.txt, homepage, dataset page).
        # A JSON-RPC initialize must come back 200 with serverInfo, and
        # tools/list must include search_servers.
        run: |
          set -euo pipefail
          init_status=$(curl -sS -o /tmp/mcp_init.json -w "%{http_code}" \
            -X POST "https://mcpjunction.ai/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"nightly-verify","version":"1.0"}}}')
          test "$init_status" = "200" || { echo "::error::/mcp initialize -> HTTP $init_status"; exit 1; }
          grep -q '"serverInfo"' /tmp/mcp_init.json || { echo "::error::/mcp initialize response missing serverInfo"; exit 1; }
          tools_status=$(curl -sS -o /tmp/mcp_tools.json -w "%{http_code}" \
            -X POST "https://mcpjunction.ai/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          test "$tools_status" = "200" || { echo "::error::/mcp tools/list -> HTTP $tools_status"; exit 1; }
          grep -q '"search_servers"' /tmp/mcp_tools.json || { echo "::error::/mcp tools/list missing search_servers"; exit 1; }
          echo "/mcp OK: initialize + tools/list"

      - name: Verify AI agent access
        # The citation strategy depends on user-initiated agent fetchers being
        # able to read the site. An edge-level bot rule can start 403ing them
        # without anything in this repo changing, and every other check here
        # still passes because they all use curl's default user agent — which
        # is exactly how this went unnoticed once already.
        #
        # Training crawlers are asserted blocked in the same step so the two
        # halves of the policy cannot drift apart: robots.txt declares both,
        # and this proves the edge enforces what is declared.
        run: |
          set -euo pipefail
          fail=0
          check() { # name, ua, expected
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" -A "$2" "https://mcpjunction.ai/")
            if [ "$code" != "$3" ]; then
              echo "::error::$1 -> HTTP $code (expected $3)"; fail=1
            else
              echo "$code  $1"
            fi
          }

          echo "--- must be allowed (agent + search traffic) ---"
          check "ChatGPT-User"         "Mozilla/5.0 (compatible; ChatGPT-User/1.0; +https://openai.com/bot)" 200
          check "Claude-User"          "Mozilla/5.0 (compatible; Claude-User/1.0; +https://anthropic.com/claude-user)" 200
          check "Perplexity-User"      "Mozilla/5.0 (compatible; Perplexity-User/1.0)" 200
          check "OAI-SearchBot"        "Mozilla/5.0 (compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot)" 200
          check "Meta-ExternalFetcher" "meta-externalfetcher/1.1" 200
          check "Googlebot"            "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" 200
          check "Bingbot"              "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)" 200

          echo "--- must be blocked (training crawlers) ---"
          # Exact vendor tokens: matching is case-sensitive, so a prettified
          # name like "Meta-ExternalAgent" sails straight through.
          check "GPTBot"             "Mozilla/5.0 (compatible; GPTBot/1.1; +https://openai.com/gptbot)" 403
          check "ClaudeBot"          "Mozilla/5.0 (compatible; ClaudeBot/1.0; +claudebot@anthropic.com)" 403
          check "CCBot"              "CCBot/2.0 (https://commoncrawl.org/faq/)" 403
          check "meta-externalagent" "meta-externalagent/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)" 403

          test "$fail" = "0" || exit 1

      - name: Verify markdown content negotiation
        # Guards two failure modes that both look fine in a browser:
        #   - the Worker stops intercepting (run_worker_first misconfigured)
        #     and agents silently get HTML
        #   - negotiation over-fires and serves markdown to humans
        # One page per surface that has markdown variants. Testing only a
        # server page is how /topics/* shipped with negotiation broken: its
        # pages and .md files were both correct, but the prefix was missing
        # from run_worker_first, so the asset store answered before the Worker
        # saw the Accept header. A new surface must be added here and to
        # run_worker_first in wrangler.jsonc together.
        run: |
          set -euo pipefail
          fail=0
          for page in \
            "https://mcpjunction.ai/servers/microsoft--playwright-mcp" \
            "https://mcpjunction.ai/categories/databases" \
            "https://mcpjunction.ai/topics/rag"
          do
            md=$(curl -sS -o /dev/null -w "%{content_type}" -H "Accept: text/markdown" "$page")
            case "$md" in
              text/markdown*) echo "markdown negotiated OK  $page" ;;
              *) echo "::error::$page Accept: text/markdown returned '$md'"; fail=1 ;;
            esac
            html=$(curl -sS -o /dev/null -w "%{content_type}" -H "Accept: text/html,*/*" "$page")
            case "$html" in
              text/html*) echo "html for browsers OK    $page" ;;
              *) echo "::error::$page browser Accept returned '$html'"; fail=1 ;;
            esac
            direct=$(curl -sS -o /dev/null -w "%{content_type}" "$page.md")
            case "$direct" in
              text/markdown*) echo "direct .md OK           $page.md" ;;
              *) echo "::error::$page.md returned '$direct'"; fail=1 ;;
            esac
          done
          test "$fail" = "0" || exit 1

      - name: Verify llms.txt declared URLs
        # llms.txt is the agent-facing index; every URL it declares must be
        # 200 zero-redirect, same contract as the sitemap.
        run: |
          set -euo pipefail
          curl -sS "https://mcpjunction.ai/llms.txt" -o /tmp/llms.txt
          fail=0
          mapfile -t urls < <(grep -oE 'https://mcpjunction\.ai[a-zA-Z0-9/_.{}-]*' /tmp/llms.txt \
            | grep -v '{' | sort -u)
          test "${#urls[@]}" -gt 0 || { echo "::error::no URLs found in llms.txt"; fail=1; }
          for u in "${urls[@]}"; do
            if [ "$u" = "https://mcpjunction.ai/mcp" ]; then
              continue  # POST endpoint; checked by the MCP step above
            fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$u")
            if [ "$code" != "200" ]; then
              echo "::error::llms.txt declares $u -> HTTP $code"; fail=1
            else
              echo "200  $u"
            fi
          done
          test "$fail" = "0" || exit 1

      - name: Submit changed URLs to IndexNow
        # Submits only the URLs whose content signature moved tonight, as
        # computed by scripts/build_sitemap.py. Resubmitting all ~1,844 URLs
        # every night — which is what this step used to do — is the behaviour
        # IndexNow's own guidance calls spam, and it buries the handful of
        # pages that genuinely changed. Non-fatal: indexing hints must never
        # fail a deploy.
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s state/changed_urls.txt ]; then
            echo "No changed URLs tonight — nothing to submit."
            exit 0
          fi
          key=$(basename public/28b2e7bcf41d41452d6b464fab1cc9bf.txt .txt)
          python3 - "$key" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1]
          with open("state/changed_urls.txt", encoding="utf-8") as fh:
              urls = [ln.strip() for ln in fh if ln.strip()]
          payload = {
              "host": "mcpjunction.ai",
              "key": key,
              "keyLocation": f"https://mcpjunction.ai/{key}.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"IndexNow: HTTP {resp.status} for {len(urls)} URLs")
          for u in urls[:25]:
              print(f"  {u}")
          PY

      - name: Verify robots.txt directives survived the edge
        # Cloudflare's managed robots.txt is documented as prepending to your
        # file but was observed replacing it, which silently drops the two
        # directives the whole licensing posture depends on. A 200 is not
        # enough — check the content actually made it through.
        run: |
          set -euo pipefail
          live=$(curl -s https://mcpjunction.ai/robots.txt)
          fail=0
          echo "$live" | grep -q "^Sitemap: https://mcpjunction.ai/sitemap.xml" \
            || { echo "::error::Sitemap directive missing from live robots.txt"; fail=1; }
          echo "$live" | grep -q "^License: https://mcpjunction.ai/license.xml" \
            || { echo "::error::License (RSL) directive missing from live robots.txt"; fail=1; }
          echo "$live" | grep -q "^Content-Signal:" \
            || { echo "::error::Content-Signal directive missing from live robots.txt"; fail=1; }
          if [ "$fail" = "1" ]; then
            echo "::error::Managed robots.txt is likely re-enabled and overwriting the file."
            echo "Fix: Cloudflare dashboard -> AI Crawl Control -> robots.txt -> turn OFF managed robots.txt."
            exit 1
          fi
          echo "robots.txt directives intact."
